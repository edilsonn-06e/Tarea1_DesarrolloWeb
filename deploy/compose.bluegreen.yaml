# Estrategia 2: Blue-Green
# Dos entornos completos (blue y green) corren en paralelo. Un Nginx "gateway"
# envía todo el tráfico al entorno activo; el otro queda listo para la versión nueva.
# El cambio de tráfico se hace con scripts/bluegreen.sh (reescribe active.conf y recarga Nginx).
#
# URL pública:          http://localhost:8081  (entorno activo)
# URL de verificación:  http://localhost:8082  (entorno inactivo, para probar antes del cambio)
name: edis-bluegreen

x-api: &api
  environment: &api-env
    MONGODB_URI: ${MONGODB_URI:-mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/edis_store?authSource=admin}
    JWT_SECRET: ${JWT_SECRET:?Definir JWT_SECRET en deploy/.env}
    CLIENT_URL: http://localhost:8081
    ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  depends_on:
    mongo:
      condition: service_healthy

services:
  mongo:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?Definir MONGO_ROOT_USER en deploy/.env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Definir MONGO_ROOT_PASSWORD en deploy/.env}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- Entorno BLUE ----------
  api-blue:
    <<: *api
    image: edis-store-api:${BLUE_VERSION:-1.0.0}
    environment:
      <<: *api-env
      DEPLOY_SLOT: blue

  web-blue:
    image: edis-store-web:${BLUE_VERSION:-1.0.0}
    environment:
      DEPLOY_SLOT: blue
      API_UPSTREAM: api-blue:4000
    depends_on:
      api-blue:
        condition: service_healthy

  # ---------- Entorno GREEN ----------
  api-green:
    <<: *api
    image: edis-store-api:${GREEN_VERSION:-1.0.0}
    environment:
      <<: *api-env
      DEPLOY_SLOT: green

  web-green:
    image: edis-store-web:${GREEN_VERSION:-1.0.0}
    environment:
      DEPLOY_SLOT: green
      API_UPSTREAM: api-green:4000
    depends_on:
      api-green:
        condition: service_healthy

  # ---------- Enrutador de tráfico ----------
  gateway:
    image: nginx:1.28-alpine
    ports:
      - "8081:80"     # tráfico de producción -> entorno activo
      - "8082:8080"   # verificación -> entorno inactivo
    volumes:
      - ./nginx/bluegreen.conf:/etc/nginx/conf.d/default.conf:ro
      - ./state/bluegreen:/etc/nginx/state:ro
    depends_on:
      web-blue:
        condition: service_healthy
      web-green:
        condition: service_healthy

volumes:
  mongo-data:
