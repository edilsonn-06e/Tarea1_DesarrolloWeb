# Gateway Blue-Green.
# El entorno activo se define en /etc/nginx/state/active.conf (lo escribe scripts/bluegreen.sh):
#     set $active_slot green;
# Si el archivo no existe, el entorno activo es blue.

# El entorno de verificación siempre es el opuesto al activo
map $active_slot $preview_slot {
    blue  green;
    green blue;
}

server {
    listen 80;
    resolver 127.0.0.11 valid=5s ipv6=off;

    set $active_slot blue;
    include /etc/nginx/state/*.conf;

    location / {
        proxy_pass http://web-$active_slot;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-Active-Slot $active_slot always;
    }
}

# Puerto de verificación: permite probar la versión nueva antes de recibir tráfico real
server {
    listen 8080;
    resolver 127.0.0.11 valid=5s ipv6=off;

    set $active_slot blue;
    include /etc/nginx/state/*.conf;

    location / {
        proxy_pass http://web-$preview_slot;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-Preview-Slot $preview_slot always;
    }
}
