# Gateway Canary.
# /etc/nginx/state/split.conf (lo escribe scripts/canary.sh) define el porcentaje, por ejemplo:
#     split_clients "${client_key}" $split_pool { 10% canary; * stable; }

# Identificador del cliente: la cookie edis_client o, si no existe, uno nuevo ($request_id)
map $cookie_edis_client $client_key {
    ""      $request_id;
    default $cookie_edis_client;
}

# Solo se envía Set-Cookie a los clientes que todavía no tienen la cookie
map $cookie_edis_client $client_cookie {
    ""      "edis_client=$request_id; Path=/; Max-Age=86400; SameSite=Lax";
    default "";
}

include /etc/nginx/state/split.conf;

# Forzar un grupo para pruebas: cabecera X-Canary: always | never
map $http_x_canary $pool {
    always  canary;
    never   stable;
    default $split_pool;
}

server {
    listen 80;
    resolver 127.0.0.11 valid=5s ipv6=off;

    location / {
        proxy_pass http://web-$pool;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Set-Cookie $client_cookie always;
        add_header X-Canary-Pool $pool always;
    }
}
